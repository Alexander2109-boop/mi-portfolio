<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto - Sistema de Gestión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><i class="bi bi-box-seam"></i> SISTEMA DE GESTIÓN</div>
        <div class="navbar-menu">
            <a href="../dashboard.html"><i class="bi bi-house-door"></i> <b>Inicio</b></a>
            <a href="../clientes/clientes-lista.html"><i class="bi bi-people"></i> <b>Clientes</b></a>
            <a href="../usuarios/usuarios-lista.html"><i class="bi bi-person-badge"></i> <b>Usuarios</b></a>
            <a href="../proveedores/proveedores-lista.html"><i class="bi bi-truck"></i> <b>Proveedores</b></a>
            <a href="inventario-lista.html"><i class="bi bi-box"></i> <b>Inventario</b></a>
            <a href="../pedidos/pedidos-lista.html"><i class="bi bi-cart"></i> <b>Pedidos</b></a>
            <a href="../login.html"><i class="bi bi-box-arrow-right"></i> <b>Cerrar Sesión</b></a>
        </div>
    </nav>

    <div class="container-small">
        <div class="breadcrumb">
            <a href="../dashboard.html">Inicio</a> / 
            <a href="inventario-lista.html">Inventario</a> / 
            Agregar Producto
        </div>

        <div class="card">
            <h1><i class="bi bi-box-seam"></i> Agregar Nuevo Producto</h1>
            <p style="color: var(--color-gray-medium); margin-bottom: 30px;">Complete el formulario para registrar un nuevo producto en el inventario</p>

            <form action="inventario-lista.html" method="get">
                <div class="form-group">
                    <label for="nombre"><i class="bi bi-tag"></i> Nombre del Producto <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Nombre descriptivo del producto">
                </div>

                <div class="form-group">
                    <label for="categoria"><i class="bi bi-collection"></i> Categoría <span class="required">*</span></label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="electronica">Electrónica</option>
                        <option value="accesorios">Accesorios</option>
                        <option value="muebles">Muebles</option>
                        <option value="oficina">Oficina</option>
                        <option value="otros">Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cantidad"><i class="bi bi-123"></i> Cantidad Inicial <span class="required">*</span></label>
                    <input type="number" id="cantidad" name="cantidad" required placeholder="0" min="0">
                </div>

                <div class="form-group">
                    <label for="precio"><i class="bi bi-currency-dollar"></i> Precio Unitario <span class="required">*</span></label>
                    <input type="number" id="precio" name="precio" required placeholder="0.00" step="0.01" min="0">
                </div>

                <div class="form-group">
                    <label for="proveedor"><i class="bi bi-truck"></i> Proveedor <span class="required">*</span></label>
                    <select id="proveedor" name="proveedor" required>
                        <option value="">Seleccione un proveedor</option>
                        <option value="p001">Distribuidora Tech</option>
                        <option value="p002">Office Supply Co.</option>
                        <option value="p003">Electrónica Global</option>
                        <option value="p004">Muebles Express</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descripcion"><i class="bi bi-journal-text"></i> Descripción</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Descripción detallada del producto..."></textarea>
                </div>

                <div class="button-group">
                    <a href="inventario-lista.html" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
