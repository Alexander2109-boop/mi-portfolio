<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido - Sistema de Gestión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Corregida ruta al CSS desde subcarpeta pedidos -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><i class="bi bi-box-seam"></i> SISTEMA DE GESTIÓN</div>
        <div class="navbar-menu">
            <a href="../dashboard.html"><i class="bi bi-house-door"></i> <b>Inicio</b></a>
            <a href="../clientes/clientes-lista.html"><i class="bi bi-people"></i> <b>Clientes</b></a>
            <a href="../usuarios/usuarios-lista.html"><i class="bi bi-person-badge"></i> <b>Usuarios</b></a>
            <a href="../proveedores/proveedores-lista.html"><i class="bi bi-truck"></i> <b>Proveedores</b></a>
            <a href="../inventario/inventario-lista.html"><i class="bi bi-box"></i> <b>Inventario</b></a>
            <a href="pedidos-lista.html"><i class="bi bi-cart"></i> <b>Pedidos</b></a>
            <a href="../login.html"><i class="bi bi-box-arrow-right"></i> <b>Cerrar Sesión</b></a>
        </div>
    </nav>

    <div class="container-small">
        <div class="breadcrumb">
            <a href="../dashboard.html">Inicio</a> / 
            <a href="pedidos-lista.html">Pedidos</a> / 
            Editar Pedido
        </div>

        <div class="card">
            <h1><i class="bi bi-pencil-square"></i> Editar Pedido</h1>
            <p style="color: var(--color-gray-medium); margin-bottom: 30px;">Actualice la información del pedido en el sistema</p>

            <div style="background-color: var(--color-gray-light); padding: 15px; border-radius: 6px; margin-bottom: 20px;">
                <strong style="color: var(--color-primary);">ID del Pedido:</strong> PED001
            </div>

            <form action="pedido-detalle.html" method="get">
                <div class="form-group">
                    <label for="cliente"><i class="bi bi-person"></i> Cliente <span class="required">*</span></label>
                    <select id="cliente" name="cliente" required>
                        <option value="">Seleccione un cliente</option>
                        <option value="c001" selected>Carlos Mendoza - TechSolutions S.A.</option>
                        <option value="c002">María Rodríguez - InnovaGroup</option>
                        <option value="c003">Juan Pérez - Comercial del Pacífico</option>
                        <option value="c004">Ana Gómez - Servicios Globales</option>
                        <option value="c005">Roberto Silva - Distribuidora Nacional</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha"><i class="bi bi-calendar"></i> Fecha del Pedido <span class="required">*</span></label>
                    <input type="date" id="fecha" name="fecha" required value="2025-01-10">
                </div>

                <div class="form-group">
                    <label for="estado"><i class="bi bi-flag"></i> Estado <span class="required">*</span></label>
                    <select id="estado" name="estado" required>
                        <option value="">Seleccione un estado</option>
                        <option value="pendiente" selected>Pendiente</option>
                        <option value="proceso">En Proceso</option>
                        <option value="completado">Completado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="metodo-pago"><i class="bi bi-credit-card"></i> Método de Pago <span class="required">*</span></label>
                    <select id="metodo-pago" name="metodo-pago" required>
                        <option value="">Seleccione un método</option>
                        <option value="efectivo">Efectivo</option>
                        <option value="tarjeta">Tarjeta de Crédito</option>
                        <option value="transferencia" selected>Transferencia Bancaria</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="direccion"><i class="bi bi-geo-alt"></i> Dirección de Envío <span class="required">*</span></label>
                    <input type="text" id="direccion" name="direccion" required value="Av. Principal 123, Guayaquil, Ecuador">
                </div>

                <div class="form-group">
                    <label for="productos"><i class="bi bi-box-seam"></i> Productos (Items del Pedido) <span class="required">*</span></label>
                    <textarea id="productos" name="productos" required>Laptop Dell Inspiron 15 x3, Mouse Inalámbrico Logitech x10, Teclado Mecánico RGB x5, Monitor LG 27" 4K x1</textarea>
                </div>

                <div class="form-group">
                    <label for="total"><i class="bi bi-currency-dollar"></i> Total del Pedido <span class="required">*</span></label>
                    <input type="number" id="total" name="total" required value="2500.00" step="0.01" min="0">
                </div>

                <div class="button-group">
                    <a href="pedido-detalle.html" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Actualizar Pedido</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
