<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Proveedor - Sistema de Gestión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Corregida ruta al CSS desde subcarpeta proveedores -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><i class="bi bi-box-seam"></i> SISTEMA DE GESTIÓN</div>
        <div class="navbar-menu">
            <a href="../dashboard.html"><i class="bi bi-house-door"></i> <b>Inicio</b></a>
            <a href="../clientes/clientes-lista.html"><i class="bi bi-people"></i> <b>Clientes</b></a>
            <a href="../usuarios/usuarios-lista.html"><i class="bi bi-person-badge"></i> <b>Usuarios</b></a>
            <a href="proveedores-lista.html"><i class="bi bi-truck"></i> <b>Proveedores</b></a>
            <a href="../inventario/inventario-lista.html"><i class="bi bi-box"></i> <b>Inventario</b></a>
            <a href="../pedidos/pedidos-lista.html"><i class="bi bi-cart"></i> <b>Pedidos</b></a>
            <a href="../login.html"><i class="bi bi-box-arrow-right"></i> <b>Cerrar Sesión</b></a>
        </div>
    </nav>

    <div class="container-small">
        <div class="breadcrumb">
            <a href="../dashboard.html">Inicio</a> / 
            <a href="proveedores-lista.html">Proveedores</a> / 
            Editar Proveedor
        </div>

        <div class="card">
            <h1><i class="bi bi-pencil-square"></i> Editar Proveedor</h1>
            <p style="color: var(--color-gray-medium); margin-bottom: 30px;">Actualice la información del proveedor en el sistema</p>

            <div style="background-color: var(--color-gray-light); padding: 15px; border-radius: 6px; margin-bottom: 20px;">
                <strong style="color: var(--color-primary);">ID del Proveedor:</strong> P001
            </div>

            <form action="proveedor-detalle.html" method="get">
                <div class="form-group">
                    <label for="nombre"><i class="bi bi-person"></i> Nombre del Contacto <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" required value="Luis Martínez">
                </div>

                <div class="form-group">
                    <label for="empresa"><i class="bi bi-building"></i> Empresa <span class="required">*</span></label>
                    <input type="text" id="empresa" name="empresa" required value="Distribuidora Tech">
                </div>

                <div class="form-group">
                    <label for="email"><i class="bi bi-envelope"></i> Correo Electrónico <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required value="luis@disttech.com">
                </div>

                <div class="form-group">
                    <label for="telefono"><i class="bi bi-telephone"></i> Teléfono <span class="required">*</span></label>
                    <input type="tel" id="telefono" name="telefono" required value="+593 99 100 2000">
                </div>

                <div class="form-group">
                    <label for="direccion"><i class="bi bi-geo-alt"></i> Dirección <span class="required">*</span></label>
                    <input type="text" id="direccion" name="direccion" required value="Av. Industrial 456, Quito">
                </div>

                <div class="form-group">
                    <label for="productos"><i class="bi bi-box-seam"></i> Productos Suministrados <span class="required">*</span></label>
                    <textarea id="productos" name="productos" required>Laptops, Tablets, Smartphones, Accesorios Tecnológicos</textarea>
                </div>

                <div class="button-group">
                    <a href="proveedor-detalle.html" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Actualizar Proveedor</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
