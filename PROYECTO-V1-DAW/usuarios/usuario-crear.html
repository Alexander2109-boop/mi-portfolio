<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Usuario - Sistema de Gestión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Corregida ruta al CSS desde subcarpeta usuarios -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><i class="bi bi-box-seam"></i> SISTEMA DE GESTIÓN</div>
        <div class="navbar-menu">
            <a href="../dashboard.html"><i class="bi bi-house-door"></i> <b>Inicio</b></a>
            <a href="../clientes/clientes-lista.html"><i class="bi bi-people"></i> <b>Clientes</b></a>
            <a href="usuarios-lista.html"><i class="bi bi-person-badge"></i> <b>Usuarios</b></a>
            <a href="../proveedores/proveedores-lista.html"><i class="bi bi-truck"></i> <b>Proveedores</b></a>
            <a href="../inventario/inventario-lista.html"><i class="bi bi-box"></i> <b>Inventario</b></a>
            <a href="../pedidos/pedidos-lista.html"><i class="bi bi-cart"></i> <b>Pedidos</b></a>
            <a href="../login.html"><i class="bi bi-box-arrow-right"></i> <b>Cerrar Sesión</b></a>
        </div>
    </nav>

    <div class="container-small">
        <div class="breadcrumb">
            <a href="../dashboard.html">Inicio</a> / 
            <a href="usuarios-lista.html">Usuarios</a> / 
            Agregar Usuario
        </div>

        <div class="card">
            <h1><i class="bi bi-person-plus"></i> Agregar Nuevo Usuario</h1>
            <p style="color: var(--color-gray-medium); margin-bottom: 30px;">Complete el formulario para registrar un nuevo usuario en el sistema</p>

            <form action="usuarios-lista.html" method="get">
                <div class="form-group">
                    <label for="nombre"><i class="bi bi-person"></i> Nombre Completo <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese el nombre completo">
                </div>

                <div class="form-group">
                    <label for="rol"><i class="bi bi-shield"></i> Rol <span class="required">*</span></label>
                    <select id="rol" name="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option value="admin">Administrador</option>
                        <option value="empleado">Empleado</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email"><i class="bi bi-envelope"></i> Correo Electrónico <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="telefono"><i class="bi bi-telephone"></i> Teléfono <span class="required">*</span></label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="+593 99 999 9999">
                </div>

                <div class="form-group">
                    <label for="password"><i class="bi bi-lock"></i> Contraseña <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
                </div>

                <div class="form-group">
                    <label for="confirm-password"><i class="bi bi-lock-fill"></i> Confirmar Contraseña <span class="required">*</span></label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Repita la contraseña">
                </div>

                <div class="button-group">
                    <a href="usuarios-lista.html" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
