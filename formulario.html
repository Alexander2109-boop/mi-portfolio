<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto Simple</title>
    <!-- Tailwind CSS CDN for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex justify-center items-start min-h-screen">

    <!-- Contenedor Principal -->
    <div class="w-full max-w-xl mx-auto bg-white p-6 sm:p-8 rounded-xl shadow-2xl mt-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 border-b pb-2 text-center">Formulario de Contacto </h1>
        <p class="text-gray-600 mb-6 text-center">Complete los siguientes campos</p>

        <!-- Formulario -->
        <form action="#" method="POST" class="space-y-6">

            <!-- Datos Basicos -->
            <fieldset class="p-5 border border-gray-200 rounded-lg bg-gray-50">
                <legend class="text-md font-semibold text-gray-700 px-2">Información Requerida</legend>
                
                <!-- GRID CONTAINER -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-4">

                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                      
                        <input type="text" id="nombre" name="nombre" placeholder="Su nombre" required class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out">
                    </div>

                    <!-- Input 2: Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
             
                        <input type="email" id="email" name="email" placeholder="su.correo@dominio.com" required class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out">
                    </div>

                    <div>
                        <label for="motivo" class="block text-sm font-medium text-gray-700 mb-1">Motivo de Contacto</label>
                  
                        <select id="motivo" name="motivo" class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out">
                            <option value="consulta">Consulta General</option>
                            <option value="soporte">Soporte Técnico</option>
                            <option value="ventas">Información de Ventas</option>
                        </select>
                    </div>

                
                    <div class="pt-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">¿Desea Respuesta?</label>
                        <div class="flex gap-4">
                            <label class="inline-flex items-center">
                                <input type="radio" name="respuesta" value="si" checked class="text-indigo-600 focus:ring-indigo-500">
                                <span class="ml-2 text-gray-700">Sí</span>
                            </label>
                            <label class="inline-flex items-center">
                                <input type="radio" name="respuesta" value="no" class="text-indigo-600 focus:ring-indigo-500">
                                <span class="ml-2 text-gray-700">No</span>
                            </label>
                        </div>
                    </div>

                </div>
            </fieldset>

            
            <fieldset class="p-5 border border-gray-200 rounded-lg bg-gray-50">
                <legend class="text-md font-semibold text-gray-700 px-2">Mensaje</legend>
                <div class="mt-4">
                    <label for="mensaje" class="block text-sm font-medium text-gray-700 mb-1">Escriba su mensaje aquí</label>
                 
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Detalle su consulta..." required class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 ease-in-out"></textarea>
                </div>
            </fieldset>

        
            <div class="space-y-4">
                <div class="flex items-center">
                    <input id="terminos" name="terminos" type="checkbox" required class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                    <label for="terminos" class="ml-2 block text-sm text-gray-900">Acepto los <a href="#" class="text-indigo-600 hover:text-indigo-500 font-medium">términos y condiciones</a>.</label>
                </div>
            

                <div class="flex justify-center">
                    <button type="submit" class="w-full px-8 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50 transition duration-150 ease-in-out transform hover:scale-[1.02]">
                        Enviar Mensaje
                    </button>
                </div>
            </div>

        </form>

       
        <script>
            document.querySelector('form').addEventListener('submit', function(e) {
                e.preventDefault();
              
                const submitButton = document.querySelector('button[type="submit"]');
                const originalText = submitButton.textContent;

                submitButton.textContent = '¡Enviado! Gracias.';
                submitButton.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                submitButton.classList.add('bg-green-500', 'hover:bg-green-600');
                submitButton.disabled = true;

                setTimeout(() => {
                    submitButton.textContent = originalText;
                    submitButton.classList.remove('bg-green-500', 'hover:bg-green-600');
                    submitButton.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    submitButton.disabled = false;
                }, 3000);
            });
        </script>
    </div>

</body>
</html>
